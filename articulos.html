<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>   
</head>

<body>
    
    <main id="mainProductos" style="position: relative;">

    <div id="portadaCarousel" class="carousel slide carouselArtic" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/imagen7.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/imagen10.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/imagen10.jpg" class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#portadaCarousel"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#portadaCarousel"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <header class="text-center mb-4 headerArt">
    
            <div class="w-100 rounded-bottom-1 justify-content-center flex-column" style="background: #cad2d446; min-height: 13vh;">
                <div>
                    <picture>
                    <!-- Imagen para pantallas pequeñas (ej. móviles) -->
                    <source class="imgMedia" media="(max-width: 768px)" srcset="images\cooltext482935093340918.png">
    
                    <!-- Imagen por defecto (para pantallas grandes) -->
                    <img src="images/cooltext483297628087331.png" class="img-fluid mb-1" alt="Catálogo de Productos">
                </picture>
                </div>
                
            <div class="container">

                    <div class="row-cols-1 w-100 d-flex justify-content-center align-items-center busca">
            
                    <!-- Botones de filtros -->
                    <div class="filtros col-md-6 d-flex justify-content-center align-content-center gap-2" id="filtrosCategorias">
                        <!-- JS inyecta los botones aquí -->
                    </div>
                    
                    <div class="col-md-6">
                        <div class="row align-items-center gx-2 filtro2">
                        <!-- Filtro tipo -->
                        <div class="w-25 col-sm-6 mb-sm-0 tipofiltro">
                            <select id="tipoFiltro" class="form-select">
                                <option value="nombre">Por nombre</option>
                                <option value="precioMin">Precio Mínimo</option>
                                <option value="precioMax">Precio Máximo</option>
                            </select>
                        </div>
                    
                        <!-- Barra de búsqueda -->
                        <div class="col-12 col-sm-7 group">
                            <svg class="icon1" aria-hidden="true" viewBox="0 0 24 24">
                                <g>
                                    <path
                                        d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                                    </path>
                                </g>
                            </svg>
                            <input id="searchBar" placeholder="Search" type="search" class="input">
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            </div>
    </header>

    <button id="carritoBtn" data-bs-toggle="modal" data-bs-target="#carritoModal">
        <i class="fas fa-shopping-cart"></i>
        <span id="carrito-contador">0</span>
    </button>

    <!-- Productos -->
    <section class="container mb-5 mt-4">

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="productosContainer"></div>

        <!-- Botones Ver Más/Ver Menos -->
        <div class="text-center mt-4">
            <button id="verMasBtn" class="btn btn-outline-primary load-more me-2">
                <i class="fas fa-plus-circle me-2"></i>Ver más
            </button>
            <button id="verMenosBtn" class="btn btn-outline-secondary load-more">
                <i class="fas fa-minus-circle me-2"></i>Ver menos
            </button>
        </div>
    </section>

    <div class="row w-100 m-0">
        <h2 class="titulo text-center py-2"><i class="bi bi-star me-5"></i>Recomendado<i class="bi bi-star ms-5"></i></h2>
        <div class="pt-4 videos">
            <div class="row justify-content-center gap-5">
                <div class="col-auto">
                    <iframe class="vi rounded-5" width="560" height="315"
                        src="https://www.youtube.com/embed/_m-uS8rCUyo?si=-VH2DsY4kQKsNMkc" title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="col-auto">
                    <iframe class="vi rounded-5" width="560" height="315"
                        src="https://www.youtube.com/embed/yYrlyXY5o_w?si=GObm2fNayq68QO8c" title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </div>
        <div class="text-center pb-4 mt-3">
            <a href="https://www.youtube.com/@atomyliderescolombia3088" target="_blank" class="btn-youtube">
                <i class="fab fa-youtube"></i>
                Más Contenido
            </a>
        </div>
    </div>

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Detalles del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modal-image" src="" class="modal-product-img img-fluid mb-3 rounded-5" alt="Imagen del producto">
                    <h4 id="modal-title" class="mb-2"></h4>
                    <h5 id="modal-price" class="text-success mb-3"></h5>
                    <p id="modal-description" class="text-muted"></p>
                </div>
                <div class="modal-footer mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="modal-add-cart" type="button" class="btn btn-primary">
                        <i class="fas fa-shopping-cart me-2"></i>Añadir al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Carrito -->
    <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Carrito de Compras</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group" id="carrito-lista"></ul>
                    <div class="mt-3 text-end fw-bold total-cars">
                        Total: $ <span id="carrito-total">0.00</span>
                    </div>
                </div>
                <div class="modal-footer gap-2">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button class="btn btn-success">Finalizar Compra</button>
                </div>
            </div>
        </div>
    </div>
    </main>  

</body>

</html>
